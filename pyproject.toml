[project]
name = "pid-control-trainer"
version = "0.1.0"
description = "PID Control Trainer for a two-phase separator simulator"
readme = "README.md"
requires-python = ">=3.8,<3.12"
authors = [
    { name = "nazri" },
]
dependencies = [
    "PyQt5>=5.15.9,<5.16",
    "pyqtgraph>=0.13.3,<0.14",
    "matplotlib>=3.5",
    "numpy>=1.21,<2",
    "scipy>=1.9.0,<1.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pid_control_trainer*"]

[tool.setuptools.package-data]
pid_control_trainer = [
    "*.ui",
    "*.png",
]

[project.gui-scripts]
pid-control-trainer = "main_panel:main"
